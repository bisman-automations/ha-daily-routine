name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # requirements_test.txt: current Home Assistant.
          - name: current
          # Oldest supported Home Assistant (hacs.json).
          - name: HA 2026.9
            pins: pytest-homeassistant-custom-component==0.13.367
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --pre -r requirements_test.txt
      - if: matrix.pins
        run: pip install --pre ${{ matrix.pins }}
      - run: ruff check . && ruff format --check .
      - run: node --test tests/test_panel_frontend.mjs
      - if: "!matrix.pins"
        run: mypy custom_components/daily_routine
      - run: pytest --cov

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
