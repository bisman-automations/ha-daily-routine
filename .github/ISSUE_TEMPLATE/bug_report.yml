name: Bug report
description: Something in Daily Routine isn't working right
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daily Routine version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings → Devices & services → Daily Routine → ⋮ → Download
        diagnostics, then drag the file here. The controller's MAC address is
        removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything logged by custom_components.daily_routine.
      render: text
