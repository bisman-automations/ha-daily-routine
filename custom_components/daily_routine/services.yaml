run_routine:
  name: Run routine
  description: Run a routine now. Its safety conditions are still enforced; the once-a-day rule does not apply.
  fields:
    routine_id:
      name: Routine ID
      description: The id of the routine to run.
      required: true
      example: morning_covers
      selector:
        text:
reload_routines:
  name: Reload routines
  description: Restart all routine schedules and sensor watchers.
skip_next:
  name: Skip next run
  description: Skip a routine's next scheduled run once. It runs as usual after that.
  fields:
    routine_id:
      name: Routine ID
      description: The id of the routine to skip.
      required: true
      example: morning_covers
      selector:
        text:
    skip:
      name: Skip
      description: Turn off to run the next time after all.
      default: true
      selector:
        boolean:
pause_routines:
  name: Pause routines until a date
  description: Skip routines' scheduled runs through a date, for example while you're on holiday. Leave the date empty to resume them.
  fields:
    routine_ids:
      name: Routine IDs
      description: The routines to pause. Leave empty for every routine.
      example: morning_covers
      selector:
        text:
          multiple: true
    until:
      name: Until
      description: The last day to skip. Leave empty to resume.
      selector:
        date:
remember_states:
  name: Remember what's on
  description: Remember which of these lights, switches and fans are on, and how the lights look, so Put back what was on can turn them back on later.
  target:
    entity:
      domain:
        - light
        - switch
        - fan
  fields:
    name:
      name: Remember as
      description: A name to put them back by.
      required: true
      example: Before we left
      selector:
        text:
put_back_states:
  name: Put back what was on
  description: Turn back on the lights, switches and fans remembered under a name, the lights as they were.
  fields:
    name:
      name: Remembered as
      description: The name they were remembered under.
      required: true
      example: Before we left
      selector:
        text:
    forget:
      name: Forget afterwards
      description: Forget them once they're back on.
      default: true
      selector:
        boolean:
