      <stop offset="0" stop-color="#0f9488"/>
      <stop offset="0.55" stop-color="#1f5fa0"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1b3a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- calendar -->
    <rect x="120" y="128" width="248" height="250" rx="36" fill="none" stroke="#fff" stroke-width="22"/>
    <path d="M120 186 h248" stroke="#fff" stroke-width="22"/>
    <rect x="164" y="96" width="26" height="64" rx="13" fill="#fff"/>
    <rect x="298" y="96" width="26" height="64" rx="13" fill="#fff"/>
