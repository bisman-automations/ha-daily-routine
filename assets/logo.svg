    <!-- clock -->
    <circle cx="352" cy="352" r="74" fill="#fff"/>
    <circle cx="352" cy="352" r="56" fill="none" stroke="#1f5fa0" stroke-width="10"/>
    <path d="M352 318 V352 L376 366" fill="none" stroke="#1f5fa0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
